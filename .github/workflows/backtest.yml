name: Backtest full H4 expansion fib - 12 months
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt

      - name: Restore 12-month M1 data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data
          key: dukascopy-m1-2025-09-15-2026-09-15-v1

      - name: Download data only if cache is unavailable
        if: steps.cache-data.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data raw
          FROM="2025-09-15"
          TO="2026-09-15"
          PAIRS="EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY GBPJPY EURCHF AUDJPY CADJPY CHFJPY EURNZD EURAUD GBPAUD GBPCAD GBPNZD AUDCAD"
          for P in $PAIRS; do
            rm -rf raw/*
            npx -y dukascopy-node@1.50.0 -i "${P,,}" -from "$FROM" -to "$TO" -t m1 -p bid -f csv -dir raw -fn "$P" -bs 5 -bp 1500
            SRC="$(find raw -type f -iname '*.csv' | head -n 1 || true)"
            test -n "$SRC" || { echo "::error::No CSV produced for $P"; exit 1; }
            cp "$SRC" "data/$P.csv"
          done

      - name: Validate full-expansion experiment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/engine.py src/backtest.py src/metrics.py
          python - <<'PY'
          from src.engine import TFS
          assert [x[0] for x in TFS] == ["M15","M5","M3"], TFS
          print("Full-expansion experiment verified; OB priority M15/M5/M3")
          PY
          test "$(find data -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 20

      - name: Run full-expansion fib with Live-1 target
        shell: bash
        run: |
          set -euo pipefail
          OUT=results/full-expansion
          python -m src.backtest --data-dir data --out-dir "$OUT" --buffer-pips 3 --tp-mode live1
          test -s "$OUT/trades.csv"
          test -s "$OUT/summary.json"
          python - <<'PY'
          import pandas as pd
          p="results/full-expansion/trades.csv"
          d=pd.read_csv(p)
          required=["expansion_start","expansion_low","expansion_high","expansion_candles","expansion_pips","breakout_pips","momentum_pct","target"]
          missing=[c for c in required if c not in d.columns]
          assert not missing, missing
          filled=d[d.status.isin(["win","loss","loss_ambiguous"])]
          print("Filled trades:",len(filled))
          print(filled[["symbol","direction","expansion_candles","expansion_pips","momentum_pct","rr","status","result_r"]].head(30).to_string(index=False))
          PY

      - name: Upload full-expansion results
        uses: actions/upload-artifact@v4
        with:
          name: full-h4-expansion-live1-2025-09-15_2026-09-15
          path: results/full-expansion/
          retention-days: 30
