name: Backtest M15-M3 OB parameter grid - 12 months
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt

      - name: Restore 12-month M1 data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data
          key: dukascopy-m1-2025-09-15-2026-09-15-v1

      - name: Download 12 months M1 bid data
        if: steps.cache-data.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data raw
          FROM="2025-09-15"
          TO="2026-09-15"
          PAIRS="EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY GBPJPY EURCHF AUDJPY CADJPY CHFJPY EURNZD EURAUD GBPAUD GBPCAD GBPNZD AUDCAD"
          for P in $PAIRS; do
            echo "Downloading $P..."
            rm -rf raw/*
            npx -y dukascopy-node@1.50.0 -i "${P,,}" -from "$FROM" -to "$TO" -t m1 -p bid -f csv -dir raw -fn "$P" -bs 5 -bp 1500
            SRC="$(find raw -type f -iname '*.csv' | head -n 1 || true)"
            test -n "$SRC" || { echo "::error::No CSV produced for $P"; exit 1; }
            cp "$SRC" "data/$P.csv"
            test -s "data/$P.csv" || { echo "::error::Empty CSV for $P"; exit 1; }
          done
          COUNT="$(find data -maxdepth 1 -type f -name '*.csv' | wc -l)"
          test "$COUNT" -eq 20 || { echo "::error::Expected 20 CSVs, found $COUNT"; exit 1; }

      - name: Validate code and cached data
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/engine.py src/backtest.py src/metrics.py
          python - <<'PY'
          from src.engine import TFS
          assert [x[0] for x in TFS] == ["M15","M5","M3"], TFS
          print("OB timeframes verified: M15, M5, M3 only")
          PY
          test "$(find data -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 20

      - name: Run 18-case TP and SL-buffer grid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/grid
          for B in 0.5 1 1.5 2 2.5 3; do
            for SPEC in "fixed:1:1R" "fixed:1.5:1.5R" "live1:2:live1-high"; do
              IFS=: read -r MODE RR LABEL <<< "$SPEC"
              OUT="results/grid/buffer-${B}_tp-${LABEL}"
              echo "=== buffer=${B} tp=${LABEL} ==="
              python -m src.backtest --data-dir data --out-dir "$OUT" --buffer-pips "$B" --tp-mode "$MODE" --rr "$RR"
              test -s "$OUT/trades.csv"
              test -s "$OUT/summary.json"
            done
          done

      - name: Build grid comparison
        shell: bash
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          rows=[]
          for p in sorted(Path("results/grid").glob("*/summary.json")):
              d=json.loads(p.read_text()); o=d["overall"]
              rows.append({"case":p.parent.name,"buffer_pips":d["buffer_pips"],"tp_mode":d["tp_mode"],"rr_value":d["rr_value"],**o})
          assert len(rows)==18, len(rows)
          keys=list(rows[0])
          with open("results/grid-comparison.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=keys);w.writeheader();w.writerows(rows)
          print("Completed 18 cases")
          for r in sorted(rows,key=lambda x:x.get("expectancy_r",-999),reverse=True):
              print(r["case"],"WR=",r.get("win_rate_pct"),"ExpR=",r.get("expectancy_r"),"TotalR=",r.get("cumulative_r"),"DD_R=",r.get("max_drawdown_r"))
          PY

      - name: Upload grid results
        uses: actions/upload-artifact@v4
        with:
          name: m15-m3-ob-grid-2025-09-15_2026-09-15
          path: results/
          retention-days: 30
