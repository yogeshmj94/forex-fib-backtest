name: Backtest OOS Sep 2023-Sep 2025
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Restore M1 data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data
          key: dukascopy-m1-2023-09-15-2025-09-15-v1

      - name: Download 12 months M1 bid data
        if: steps.cache-data.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data raw
          FROM="2023-09-15"
          TO="2025-09-15"
          PAIRS="EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY GBPJPY EURCHF AUDJPY CADJPY CHFJPY EURNZD EURAUD GBPAUD GBPCAD GBPNZD AUDCAD"
          for P in $PAIRS; do
            echo "Downloading $P..."
            rm -rf raw/*
            npx -y dukascopy-node@1.50.0 -i "${P,,}" -from "$FROM" -to "$TO" -t m1 -p bid -f csv -dir raw -fn "$P" -bs 5 -bp 1500
            echo "Files produced for $P:"
            find raw -type f -maxdepth 5 -print
            SRC="$(find raw -type f -iname '*.csv' | head -n 1 || true)"
            if [ -z "$SRC" ]; then
              echo "::error::No CSV produced for $P"
              exit 1
            fi
            cp "$SRC" "data/$P.csv"
            test -s "data/$P.csv" || { echo "::error::Empty CSV for $P"; exit 1; }
            echo "$P rows: $(wc -l < "data/$P.csv")"
          done
          COUNT="$(find data -maxdepth 1 -type f -name '*.csv' | wc -l)"
          echo "Validated CSV count: $COUNT"
          test "$COUNT" -eq 20 || { echo "::error::Expected 20 CSVs, found $COUNT"; exit 1; }
          ls -lh data
          head -n 3 data/EURUSD.csv
      - name: Validate historical data
        shell: bash
        run: |
          COUNT="$(find data -maxdepth 1 -type f -name '*.csv' | wc -l)"
          test "$COUNT" -eq 20 || { echo "::error::Expected 20 CSVs, found $COUNT"; exit 1; }
          test -s data/EURUSD.csv || { echo "::error::EURUSD data missing/empty"; exit 1; }

      - name: Preflight frozen strategy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/engine.py src/backtest.py src/metrics.py
          python - <<'PY'
          import json
          cfg=json.load(open("config.json"))
          assert cfg["stop_buffer_pips"] == 3.0, cfg
          assert cfg["risk_per_trade_pct"] == 0.3, cfg
          assert len(cfg["pairs"]) == 20, len(cfg["pairs"])
          print("Frozen strategy verified: buffer=3 pips, risk=0.3%, pairs=20")
          PY

      - name: Run frozen OOS backtest
        run: |
          set -euo pipefail
          python -m src.backtest --data-dir data --out-dir results/oos-2023-09-15_2025-09-15 --buffer-pips 3 --tp-mode fixed --rr 1
          test -s results/oos-2023-09-15_2025-09-15/trades.csv || { echo "::error::OOS trades missing"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/oos-2023-09-15_2025-09-15/summary.json")
          if not p.exists():
              raise SystemExit("OOS summary missing")
          d=json.loads(p.read_text())
          assert d["buffer_pips"] == 3.0, d["buffer_pips"]
          assert d["tp_mode"] == "fixed", d["tp_mode"]
          assert d["rr_value"] == 1.0, d["rr_value"]
          assert len(d["per_pair"]) == 20, len(d["per_pair"])
          assert abs(d["overall"]["avg_rr"] - 1.0) < 1e-9, d["overall"]["avg_rr"]
          print(json.dumps(d["overall"], indent=2))
          print("OOS sanity checks passed")
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: forex-fib-oos-2023-09-15_2025-09-15-results
          path: results/
          retention-days: 30
