name: Backtest 3pip Live-1 momentum diagnostic - 12 months
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt

      - name: Restore 12-month M1 data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data
          key: dukascopy-m1-2025-09-15-2026-09-15-v1

      - name: Download data only if cache is unavailable
        if: steps.cache-data.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data raw
          FROM="2025-09-15"
          TO="2026-09-15"
          PAIRS="EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY GBPJPY EURCHF AUDJPY CADJPY CHFJPY EURNZD EURAUD GBPAUD GBPCAD GBPNZD AUDCAD"
          for P in $PAIRS; do
            echo "Downloading $P..."
            rm -rf raw/*
            npx -y dukascopy-node@1.50.0 -i "${P,,}" -from "$FROM" -to "$TO" -t m1 -p bid -f csv -dir raw -fn "$P" -bs 5 -bp 1500
            SRC="$(find raw -type f -iname '*.csv' | head -n 1 || true)"
            test -n "$SRC" || { echo "::error::No CSV produced for $P"; exit 1; }
            cp "$SRC" "data/$P.csv"
          done

      - name: Validate cached data and momentum code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/engine.py src/backtest.py src/metrics.py
          python - <<'PY'
          from src.engine import TFS
          assert [x[0] for x in TFS] == ["M15","M5","M3"], TFS
          print("OB timeframes verified: M15, M5, M3 only")
          PY
          test "$(find data -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 20

      - name: Run 3 pip Live-1 backtest with momentum diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m src.backtest --data-dir data --out-dir results/momentum --buffer-pips 3 --tp-mode live1 --rr 2
          test -s results/momentum/trades.csv
          test -s results/momentum/summary.json
          python - <<'PY'
          import pandas as pd
          p="results/momentum/trades.csv"
          d=pd.read_csv(p)
          required=["live2_low","live2_high","live1_open","live1_high","live1_low","live1_close","impulse_pips","breakout_pips","momentum_pct"]
          missing=[c for c in required if c not in d.columns]
          assert not missing, missing
          filled=d[d.status.isin(["win","loss","loss_ambiguous"])]
          print("Filled trades:",len(filled))
          print("Momentum diagnostics present:",required)
          print(filled[["symbol","direction","signal_time","impulse_pips","breakout_pips","momentum_pct","status","result_r"]].head(20).to_string(index=False))
          PY

      - name: Upload momentum results
        uses: actions/upload-artifact@v4
        with:
          name: momentum-3pip-live1-2025-09-15_2026-09-15
          path: results/momentum/
          retention-days: 30
